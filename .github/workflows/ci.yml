name: CI

on:
  push:
    branches: [ main, pilot/lockdown ]
  pull_request:
    branches: [ main, pilot/lockdown ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run dev + tests
        run: |
          set -euo pipefail
          # limit runtime in CI to avoid stuck jobs
          export PORT=${PORT:-3001}
          bash ./scripts/dev-test.sh --reporter=list
        env:
          PORT: 3001
        timeout-minutes: 20
